name: Build CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Validate version
      shell: bash
      run: |
        set -eu
        . ./VERSION
        [[ "$VERSION" =~ ^6\.2\.[0-9]+$ ]] || {
          echo "Invalid VERSION: $VERSION"
          exit 1
        }
        [ "$VERSION_CODE" = "${VERSION##*.}" ] || {
          echo "VERSION_CODE must match the final VERSION component"
          exit 1
        }
        previous_code=$(git show HEAD^:VERSION 2>/dev/null | sed -n 's/^VERSION_CODE=//p' || true)
        if [ -n "$previous_code" ] && ! git diff --quiet HEAD^ HEAD -- VERSION &&
            [ "$VERSION_CODE" -le "$previous_code" ]; then
          echo "VERSION_CODE must increase when VERSION changes"
          exit 1
        fi

    - name: Validate module scripts
      run: |
        bash -n targets/magisk_module/module/customize.sh
        bash -n targets/magisk_module/module/bin/bl_flasher.sh

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y lld clang llvm uuid-dev liblzma-dev mingw-w64 zip
        python3 -m pip install tree-sitter-language-pack==0.11.0 tree-sitter==0.25.2

    - name: Setup Variables
      run: |
        echo "NDK_PATH=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

    - name: Build Toolkits
      run: |
        make target_toolkit_linux
        make target_toolkit_windows
        make target_toolkit_android

    - name: Build Magisk Module
      run: |
        make target_magisk_module
        . ./VERSION
        grep -qx "version=$VERSION" targets/magisk_module/build/module/module.prop
        grep -qx "versionCode=$VERSION_CODE" targets/magisk_module/build/module/module.prop

    - name: Build VBMeta Fixer
      run: |
        make tools_vbmetafixer_linux
        make tools_vbmetafixer_windows
        make tools_vbmetafixer_android

    - name: Unpack artifacts
      run: |
        mkdir -p artifacts/toolkit_linux artifacts/toolkit_windows artifacts/toolkit_android artifacts/magisk_module
        mkdir -p artifacts/vbmetafixer_linux artifacts/vbmetafixer_windows artifacts/vbmetafixer_android
        unzip targets/toolkit_linux/build/toolkit_linux.zip -d artifacts/toolkit_linux
        unzip targets/toolkit_windows/build/toolkit_windows.zip -d artifacts/toolkit_windows
        unzip targets/toolkit_android/build/toolkit_android.zip -d artifacts/toolkit_android
        unzip targets/magisk_module/build/module_android.zip -d artifacts/magisk_module
        cp -r tools/vbmetafixer/build/toolkit/* artifacts/vbmetafixer_linux/
        cp -r tools/vbmetafixer/build/toolkit_win/* artifacts/vbmetafixer_windows/
        cp -r tools/vbmetafixer/build/toolkit_android/* artifacts/vbmetafixer_android/

    - name: Check packaged scripts
      run: |
        python3 tools/strip_comments.py artifacts --check
        python3 - <<'PY'
        from pathlib import Path
        import struct
        import subprocess
        from tools.strip_comments import embedded_code

        webroot = Path("artifacts/magisk_module/webroot")
        assert {path.name for path in webroot.iterdir()} == {"index.html"}
        assert not any(path.name.upper() in {"NOTICE", "LICENSE"} for path in Path("artifacts").rglob("*"))
        ablrepo = Path("artifacts/magisk_module/ablrepo")
        assert all(path.name in {"abl.img", "abl.sha256"} for path in ablrepo.rglob("*") if path.is_file())
        for target in ("magisk_module", "toolkit_android"):
            binary = (Path("artifacts") / target / "bin/extractfv").read_bytes()
            header = struct.unpack_from("<16sHHIQQQIHHHHHH", binary)
            sections = [struct.unpack_from("<IIQQQQIIQQ", binary, header[6] + index * header[11])
                        for index in range(header[12])]
            names = sections[header[13]]
            names = binary[names[4]:names[4] + names[5]]
            assert not any(names[section[0]:].split(b"\0", 1)[0].startswith(b".debug") for section in sections)
            assert len(binary) < 2 * 1024 * 1024
        html = (webroot / "index.html").read_bytes()
        scripts = [html[start:end] for start, end, suffix in embedded_code(html) if suffix == ".js"]
        assert len(scripts) == 1
        for script in scripts:
            subprocess.run(["node", "--input-type=module", "--check"], input=script, check=True)
        PY
        while IFS= read -r -d '' file; do
          case "$file" in
            *.sh) bash -n "$file" ;;
            *.js) node --check "$file" ;;
          esac
        done < <(find artifacts -type f \( -name '*.sh' -o -name '*.js' \) -print0)

    - name: Upload Linux Toolkit
      uses: actions/upload-artifact@v4
      with:
        name: toolkit_linux
        path: artifacts/toolkit_linux/*

    - name: Upload Windows Toolkit
      uses: actions/upload-artifact@v4
      with:
        name: toolkit_windows
        path: artifacts/toolkit_windows/*

    - name: Upload Android Toolkit
      uses: actions/upload-artifact@v4
      with:
        name: toolkit_android
        path: artifacts/toolkit_android/*

    - name: Upload Magisk Module
      uses: actions/upload-artifact@v4
      with:
        name: magisk_module
        path: artifacts/magisk_module/*

    - name: Upload VBMeta Fixer Linux
      uses: actions/upload-artifact@v4
      with:
        name: vbmetafixer_linux
        path: artifacts/vbmetafixer_linux/*

    - name: Upload VBMeta Fixer Windows
      uses: actions/upload-artifact@v4
      with:
        name: vbmetafixer_windows
        path: artifacts/vbmetafixer_windows/*

    - name: Upload VBMeta Fixer Android
      uses: actions/upload-artifact@v4
      with:
        name: vbmetafixer_android
        path: artifacts/vbmetafixer_android/*
